name: Daten aktualisieren

on:
  schedule:
    - cron: "17 */2 * * *"   # alle 2 Stunden
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-data.mjs
      - name: Änderungen committen
        run: |
          git config user.name "fuppes-bot"
          git config user.email "fuppes-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Daten aktualisiert" && git push)
